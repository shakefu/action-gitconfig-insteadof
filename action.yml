name: 'gitconfig insteadOf'
description: 'Rewrite GitHub URLs in the global git config to use token authentication'
inputs:
  token:
    description: GitHub personal access token
    required: true
  prefix:
    description: URL path prefix to rewrite
    required: false
    default: ""
  server:
    description: GitHub server name, if not using hosted
    required: false
    default: ""
runs:
  using: 'node24'
  # pre: 'dist/index.js'
  main: 'dist/main/index.js'
  post: 'dist/post/index.js'
